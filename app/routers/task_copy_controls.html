<style>
.copy-field{position:relative;display:inline-block;max-width:100%;box-sizing:border-box;padding-right:23px;vertical-align:middle;overflow-wrap:anywhere}
.copy-field .customer-email{display:inline}
.copy-button{position:absolute;right:0;top:0;width:21px;height:21px;display:inline-flex;align-items:center;justify-content:center;padding:2px;border:0;border-radius:4px;background:transparent;color:#718096;cursor:pointer;opacity:0;transition:opacity .12s}
.copy-field:hover .copy-button,.copy-field:focus-within .copy-button{opacity:1}
.copy-button:hover,.copy-button:focus-visible{background:#e8effb;color:#1263ce}
@media(hover:none){.copy-button{opacity:1}}
.copy-feedback{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);z-index:1000;padding:9px 16px;background:#19334d;color:white;border-radius:8px;box-shadow:0 4px 16px #0002;pointer-events:none}
.copy-feedback:empty{display:none}
</style>
<div class="copy-feedback" role="status" aria-live="polite"></div>
<script>
(()=>{
const feedback=document.querySelector('.copy-feedback');let timer;
function fallbackCopy(value){
 const input=document.createElement('textarea');input.value=value;input.readOnly=true;
 input.style.cssText='position:fixed;left:-9999px;top:0';document.body.append(input);
 const previous=document.activeElement;
 try{input.select();if(!document.execCommand('copy'))throw new Error('copy');}
 finally{input.remove();previous?.focus({preventScroll:true});}
}
document.addEventListener('click',async event=>{
 const button=event.target.closest('.copy-button');if(!button)return;
 event.preventDefault();event.stopPropagation();
 try{
  const value=button.dataset.copyValue;
  try{if(!navigator.clipboard?.writeText)throw new Error('clipboard');await navigator.clipboard.writeText(value);}
  catch{fallbackCopy(value);}
  feedback.textContent='{{i18n:copy_done:js}}';
 }catch{feedback.textContent='{{i18n:copy_failed:js}}';}
 clearTimeout(timer);timer=setTimeout(()=>feedback.textContent='',2200);
});
})();
</script>

<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>水印设置 · Paintingify</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#202d3d;font:14px/1.5 system-ui,-apple-system,sans-serif}main{max-width:1250px;padding:28px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}h1{margin:0;font-size:26px}h2{font-size:17px;margin:0 0 5px}p{margin:5px 0 18px;color:#657286}.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:24px}.card{background:white;border:1px solid #dce3eb;border-radius:14px;padding:22px;margin-bottom:18px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{display:block;font-weight:600;margin:10px 0 6px}input:not([type=checkbox]),select,textarea{width:100%;padding:10px;border:1px solid #bfcbd8;border-radius:7px;font:inherit;background:white}input[type=file]{font-size:12px}input[type=checkbox]{margin-right:8px}textarea{resize:vertical;min-height:80px}.asset{height:100px;width:100%;object-fit:contain;background:repeating-conic-gradient(#f1f1f1 0% 25%,#fff 0% 50%) 50%/16px 16px;border:1px solid #e7ebef;border-radius:8px;margin:12px 0 4px}.hint{color:#68768a;font-size:12px;font-weight:400}.preview{position:sticky;top:22px}.preview img{display:block;width:100%;border-radius:9px;border:1px solid #e5eaf0}.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}button,.back{padding:10px 15px;border-radius:8px;border:1px solid #bfcbd8;background:#fff;color:#26394c;font:600 14px system-ui;cursor:pointer;text-decoration:none}button.primary{background:#1769d2;border-color:#1769d2;color:white}button:disabled{opacity:.55;cursor:wait}#message{margin-bottom:16px;padding:12px;border-radius:8px;background:#eaf5ec;color:#236231}#message.error{background:#fff0ee;color:#ac3020}[hidden]{display:none!important}@media(max-width:850px){.layout{grid-template-columns:1fr}.preview{position:static}.fields{grid-template-columns:1fr}main{padding:18px}}
</style></head><body><main><header><div><h1>水印设置</h1><p>自定义顾客看到的水印预览图，保留无水印原图。</p></div><a class="back" href="/admin/tasks">任务记录</a></header><div id="message" role="status" hidden></div>
<form id="watermark-form"><div class="layout"><div>
<section class="card"><h2>水印图片</h2><p>用于画面中央或整张图片平铺，推荐透明背景 PNG。</p><img class="asset" id="watermark-image" alt="当前水印图"><label for="watermark">更换水印图</label><input id="watermark" name="watermark" type="file" accept="image/png,image/jpeg,image/webp"><span class="hint">支持 PNG、JPG、WebP，最大 5 MB。不选文件则保留当前图片。</span></section>
<section class="card"><h2>平铺方式</h2><div class="fields"><div><label for="layout">水印布局</label><select id="layout" name="layout"><option value="uniform_diagonal">均匀斜向平铺</option><option value="grid">横向网格平铺</option><option value="random">随机错位平铺</option><option value="center">居中单个水印</option></select></div><div><label for="opacity">水印不透明度</label><input id="opacity" name="opacity" type="number" min="0" max="1" step="0.05"><span class="hint">0 为透明，1 为不透明</span></div><div><label for="size">平铺图标宽度（像素）</label><input id="size" name="size" type="number" min="40" max="1000" step="1"></div><div><label for="angle">旋转角度（度）</label><input id="angle" name="angle" type="number" min="-180" max="180" step="1"></div><div><label for="gap_x">横向间距（像素）</label><input id="gap_x" name="gap_x" type="number" min="10" max="1000" step="1"></div><div><label for="gap_y">纵向间距（像素）</label><input id="gap_y" name="gap_y" type="number" min="10" max="1000" step="1"></div></div><p class="hint" id="layout-hint"></p></section>
<section class="card"><h2>角标文字</h2><label><input name="corner_enabled" type="checkbox">显示水印文字</label><label for="corner_position">文字位置</label><select id="corner_position" name="corner_position"><option value="top_right">右上角</option><option value="top_left">左上角</option></select><label for="corner_text">水印文字</label><textarea id="corner_text" name="corner_text" maxlength="200" rows="3"></textarea><span class="hint">最多 200 字，长文字会自动缩小以完整显示。</span></section>
<section class="card"><h2>品牌 Logo</h2><p>叠加在预览图的右下角。</p><label><input name="brand_enabled" type="checkbox">显示品牌 Logo</label><img class="asset" id="brand-image" alt="当前品牌 Logo"><label for="brand">更换 Logo</label><input id="brand" name="brand" type="file" accept="image/png,image/jpeg,image/webp"><div class="fields"><div><label for="brand_scale">Logo 大小比例</label><input id="brand_scale" name="brand_scale" type="number" min="0.05" max="0.6" step="0.05"></div><div><label for="brand_opacity">Logo 不透明度</label><input id="brand_opacity" name="brand_opacity" type="number" min="0" max="1" step="0.05"></div></div></section>
</div><aside><section class="card preview"><h2>效果预览</h2><p>使用示意图预览当前配置。</p><img id="preview" alt="水印效果预览" hidden><p id="preview-placeholder">正在加载当前水印效果…</p><div class="actions" style="margin-top:18px"><button type="button" id="preview-button">更新预览</button><button type="submit" class="primary" id="save-button">保存设置</button></div><p class="hint" style="margin-top:14px">保存后对新生成的预览图立即生效，历史图片保持原样。</p></section></aside></div></form></main>
<script>
const form=document.getElementById('watermark-form'),message=document.getElementById('message');
let previewUrl; const objectUrls={};
function notify(text,error=false){message.textContent=text;message.className=error?'error':'';message.hidden=false;}
function updateLayout(){const layout=form.elements.layout.value;for(const key of ['size','angle','gap_x','gap_y'])form.elements[key].disabled=layout==='center'||(key==='angle'&&layout==='grid')||(key==='gap_y'&&layout==='random');document.getElementById('layout-hint').textContent=layout==='center'?'居中模式使用单个水印，不应用平铺间距和旋转角度。':layout==='random'?'随机模式使用横向间距控制整体密度，并自动变化角度与位置。':'间距按原图像素计算，预览图会按比例缩小。';}
function payload(){const values={};for(const key of ['layout','corner_text','corner_position'])values[key]=form.elements[key].value;for(const key of ['opacity','size','angle','gap_x','gap_y','brand_scale','brand_opacity'])values[key]=Number(form.elements[key].value);for(const key of ['corner_enabled','brand_enabled'])values[key]=form.elements[key].checked;const data=new FormData();data.append('settings',JSON.stringify(values));for(const key of ['watermark','brand'])if(form.elements[key].files[0])data.append(key,form.elements[key].files[0]);return data;}
async function submit(previewOnly){if(!form.reportValidity())return;const buttons=[document.getElementById('save-button'),document.getElementById('preview-button')];buttons.forEach(b=>b.disabled=true);try{const response=await fetch('/admin/watermark/'+(previewOnly?'preview':'settings'),{method:'POST',body:payload()});if(!response.ok){let data=await response.json().catch(()=>({}));throw new Error(data.detail||'操作失败，请重新打开设置页后重试。');}if(previewOnly){if(previewUrl)URL.revokeObjectURL(previewUrl);previewUrl=URL.createObjectURL(await response.blob());document.getElementById('preview').src=previewUrl;document.getElementById('preview').hidden=false;document.getElementById('preview-placeholder').hidden=true;}else{notify((await response.json()).message);}}catch(e){notify(e.message,true);}finally{buttons.forEach(b=>b.disabled=false);}}
form.addEventListener('submit',e=>{e.preventDefault();submit(false);});document.getElementById('preview-button').onclick=()=>submit(true);form.elements.layout.onchange=updateLayout;
for(const key of ['watermark','brand'])form.elements[key].onchange=()=>{const file=form.elements[key].files[0];if(!file)return;if(file.size>5*1024*1024){notify('图片不能超过 5 MB',true);form.elements[key].value='';return;}if(objectUrls[key])URL.revokeObjectURL(objectUrls[key]);objectUrls[key]=URL.createObjectURL(file);document.getElementById(key+'-image').src=objectUrls[key];};
(async()=>{try{const response=await fetch('/admin/watermark/settings');if(!response.ok)throw new Error('无法读取配置，请重新登录后再试。');const data=await response.json();for(const [key,value] of Object.entries(data)){const element=form.elements[key];if(element){if(element.type==='checkbox')element.checked=value;else element.value=value;}}for(const key of ['watermark','brand'])document.getElementById(key+'-image').src='/admin/watermark/assets/'+key;updateLayout();await submit(true);}catch(e){notify(e.message,true);}})();
</script></body></html>
